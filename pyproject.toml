[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "colorscheme-tools"
version = "0.1.0"
description = "Create, convert and render colourschemes from one colorschemes.json per scheme"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cstools = "cstools.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cstools.targets" = ["*.lua", "neovim_runtime/*.lua"]
"cstools.gallery" = ["assets/*"]
